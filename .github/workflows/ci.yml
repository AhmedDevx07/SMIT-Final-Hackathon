name: MaintainIQ CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ==========================================
  # Job 1: Frontend Verification (Lint & Build)
  # ==========================================
  frontend-ci:
    name: Frontend (Build & Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: ./frontend
        env:
          VITE_API_URL: https://smit-final-hackathon-backend-nu.vercel.app/api
        run: npm run build

  # ==========================================
  # Job 2: Backend Verification (Syntax & Deps)
  # ==========================================
  backend-ci:
    name: Backend (Syntax & Dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check JavaScript Syntax
        run: |
          node --check backend/server.js
          node --check backend/seeder.js

  # ==========================================
  # Job 3: Docker Build Verification
  # ==========================================
  docker-ci:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: maintainiq-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          build-args: |
            VITE_API_URL=http://localhost:5000/api
          push: false
          tags: maintainiq-frontend:ci-test
